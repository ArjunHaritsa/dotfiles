
# ==============================================================================
# 4. Dotfiles
# ==============================================================================

[dotfiles]

# Home configuration files
"~/.zshrc" = "../../.zshrc"
"~/.zsh_plugins.txt" = "../../.zsh_plugins.txt"
"~/.wezterm.lua" = "../../.wezterm.lua"

# Application configurations
"~/.config/starship.toml" = "../starship.toml"

# Configuration directories
"~/.config/nvim/lua" = "../nvim/lua"
"~/.config/tmux" = "../tmux"

# Mise configuration
"~/.config/mise/config.toml" = "config.toml"
"~/.config/mise/miserc.toml" = "miserc.toml"
"~/.config/mise/conf.d" = "conf.d"

