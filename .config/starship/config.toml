"$schema" = 'https://starship.rs/config-schema.json'


format = """\
${custom.diricon} \
${all}"""

right_format = """$os$time"""

[os]
format = '[$symbol ]($style)'
style = "bold white"
disabled = false

[os.symbols]
Macos=" "

[time]
disabled = false
format = '[$time]($style) '
style = "bold white"

[custom.diricon]
description = "Display symbol for active Git server"
command = """
if [[ $(command git rev-parse --is-inside-work-tree 2> /dev/null) == true ]]; then
  GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
  if [[ "$GIT_REMOTE" =~ "github" ]]; then
      GIT_REMOTE_SYMBOL=" "
  elif [[ "$GIT_REMOTE" =~ "codeberg" ]]; then
      GIT_REMOTE_SYMBOL="󰲋 "
  elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
      GIT_REMOTE_SYMBOL=" "
  elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
      GIT_REMOTE_SYMBOL=" "
  elif [[ "$GIT_REMOTE" =~ "git" ]]; then
      GIT_REMOTE_SYMBOL=" "
  else
      GIT_REMOTE_SYMBOL=" "
  fi
  echo "$GIT_REMOTE_SYMBOL "
else
  echo " "
fi
"""
format = "$output"
when = true
require_repo = false
ignore_timeout = true
